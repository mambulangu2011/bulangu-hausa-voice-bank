<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>BULANGU MARKET V2</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f0f2ff}
header{background:#0f2b6a;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:9}
.tabs{display:flex;gap:6px;padding:8px;background:#fff;position:sticky;top:62px;z-index:8}
.tabs button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;background:#eef2ff;color:#0f2b6a}
.tabs button.active{background:#0f2b6a;color:#fff}
.card{background:#fff;margin:12px;padding:14px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,textarea,select{width:100%;padding:13px;border:2px solid #0f2b6a20;border-radius:10px;margin:6px 0;font-size:15px}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:900;margin:6px 0;color:#fff;font-size:15px}
.btn-r{background:#e11} .btn-b{background:#0f2b6a} .btn-g{background:#16a34a} .btn-o{background:#2563eb}
.m-item{background:#f3f6ff;border-radius:10px;padding:10px;margin:8px 0;display:flex;gap:8px;align-items:center;justify-content:space-between}
.small{font-size:13px;color:#555}
#preview{width:100%;display:none;border-radius:14px;max-height:350px;object-fit:cover;border:3px solid #16a34a;margin:8px 0}
.badge{background:#0f2b6a;color:#fff;padding:2px 8px;border-radius:20px;font-size:12px}
</style>
</head>
<body>
<header>
<b style="font-size:18px">BULANGU MARKET V2</b><br>
<div style="display:flex;gap:6px;margin-top:10px">
<div style="flex:1;background:#ffffff22;padding:7px;border-radius:8px">Murya <b id="vc">0</b></div>
<div style="flex:1;background:#ffffff22;padding:7px;border-radius:8px">Hoto <b id="pc">0</b></div>
<div style="flex:1;background:#ffffff22;padding:7px;border-radius:8px">Jimilla <b id="val">0</b></div>
</div>
</header>
<div class="tabs">
<button id="t1" class="active" onclick="sh(1)">🎙️ Murya</button>
<button id="t2" onclick="sh(2)">📸 HOTO</button>
<button id="t3" onclick="sh(3)">💾 Siyarwa</button>
</div>

<div id="v1" class="card">
<h3>🎙️ Ajiye Murya</h3>
<input id="name" placeholder="Suna: Musa Bulangu">
<textarea id="txt" placeholder="Me ka fada: Gona, Dabbobi, Kifi..."></textarea>
<button class="btn btn-r" id="recBtn" onclick="toggleRec()">🎙️ RIQE DON RIKODI</button>
<div id="recInfo" class="small" style="text-align:center;font-weight:700"></div>
<audio id="aud" controls style="width:100%;display:none;margin:8px 0"></audio>
<div style="display:flex;gap:6px">
<button class="btn btn-b" style="flex:1" onclick="saveVoice()">💾 AJIYE MURYA</button>
<button class="btn" style="flex:1;background:#666" onclick="clearRec()">🗑️ GOGE</button>
</div>
<hr>
<b>Muryoyina (<span id="vlistC">0</span>)</b>
<div id="vlist"></div>
</div>

<div id="v2" class="card" style="display:none">
<div style="background:#dcfce7;border:2px dashed #16a34a;padding:14px;border-radius:12px;text-align:center">
<h2 style="color:#16a34a;margin:0">📸 WAJEN DAUKAR HOTO</h2>
<p class="small">Dauki hoton gona, dabbobi, kayan gona</p>
</div>
<select id="ptype">
<option>Gona - Farm</option>
<option>Gida - House</option>
<option>Mutum - Person</option>
<option>Dabba - Animal</option>
<option>Kasuwa - Market</option>
<option>Abinci - Food</option>
</select>
<textarea id="pdesc" rows="3" placeholder="Bayani: Gonar shinkafa a Bulangu, Jigawa, damina..."></textarea>
<div style="display:flex;gap:8px">
<button class="btn btn-g" style="flex:1" onclick="document.getElementById('cam').click()">📸 DAUKI DA CAMERA</button>
<button class="btn btn-o" style="flex:1" onclick="document.getElementById('gal').click()">🖼️ GALLERY</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal" accept="image/*" style="display:none">
<img id="preview">
<div id="pinfo" class="small" style="text-align:center;color:green;font-weight:800"></div>
<div style="display:flex;gap:6px">
<button class="btn btn-g" style="flex:1" onclick="savePhoto()">💾 AJIYE HOTO</button>
<button class="btn" style="flex:1;background:#666" onclick="clearPhoto()">🗑️ GOGE</button>
</div>
<hr>
<b>Hotuna (<span id="plistC">0</span>)</b>
<div id="plist" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"></div>
</div>

<div id="v3" class="card" style="display:none">
<h3>💾 Siyarwa / Saukewa</h3>
<div style="background:#f3f6ff;padding:12px;border-radius:10px">
Murya: <span id="sv">0</span><br>
Hoto: <span id="sp">0</span><br>
<b>Jimilla: <span id="stot">0</span></b>
</div>
<button class="btn btn-o" onclick="zipPhotos()">📦 Sauke HOTUNA ZIP</button>
<button class="btn btn-b" onclick="zipVoices()">🎵 Sauke MURYA ZIP</button>
<button class="btn btn-g" onclick="zipAll()">📦 Sauke DUKA ZIP</button>
<button class="btn" style="background:#b00" onclick="clearAll()">🗑️ GOGE DUKA</button>
<div id="status" class="small" style="text-align:center;margin-top:8px;font-weight:700"></div>
</div>

<script>
let voices=JSON.parse(localStorage.getItem('bv_voices')||'[]');
let photos=JSON.parse(localStorage.getItem('bv_photos')||'[]');
let rec=null,chunks=[],isRec=false,timer=null,secs=0,curBlob=null,curAudioURL=null,curPhotoData=null;
function sh(n){
 document.getElementById('v1').style.display=n==1?'block':'none';
 document.getElementById('v2').style.display=n==2?'block':'none';
 document.getElementById('v3').style.display=n==3?'block':'none';
 document.getElementById('t1').className=n==1?'active':'';
 document.getElementById('t2').className=n==2?'active':'';
 document.getElementById('t3').className=n==3?'active':'';
}
async function toggleRec(){
 let btn=document.getElementById('recBtn');
 if(!isRec){
  try{
   let stream=await navigator.mediaDevices.getUserMedia({audio:true});
   rec=new MediaRecorder(stream); chunks=[]; secs=0;
   rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
   rec.onstop=()=>{
    curBlob=new Blob(chunks,{type:'audio/webm'});
    if(curAudioURL) URL.revokeObjectURL(curAudioURL);
    curAudioURL=URL.createObjectURL(curBlob);
    let a=document.getElementById('aud'); a.src=curAudioURL; a.style.display='block'; a.load();
    document.getElementById('recInfo').innerHTML='✅ Shiri! '+secs+'s - Danna Play don ji';
    stream.getTracks().forEach(t=>t.stop());
   };
   rec.start(); isRec=true;
   btn.innerHTML='⏸️ TSAYA - '+secs+'s'; btn.style.background='#000';
   timer=setInterval(()=>{secs++; btn.innerHTML='⏸️ TSAYA - '+secs+'s'; document.getElementById('recInfo').innerHTML='🔴 Ana rikodi... '+secs+'s'},1000);
  }catch(e){alert('Ba a ba da izinin microphone: '+e.message)}
 }else{
  rec.stop(); isRec=false; clearInterval(timer);
  btn.innerHTML='✅ Shiri! '+secs+'s - Danna don sake rikodi'; btn.style.background='#e11';
 }
}
function clearRec(){
 if(curAudioURL) URL.revokeObjectURL(curAudioURL);
 curBlob=null; curAudioURL=null; chunks=[];
 let a=document.getElementById('aud'); a.pause(); a.src=''; a.style.display='none';
 document.getElementById('recInfo').innerHTML=''; secs=0;
 document.getElementById('recBtn').innerHTML='🎙️ RIQE DON RIKODI'; document.getElementById('recBtn').style.background='#e11';
}
async function blobToBase64(blob){return new Promise(r=>{let fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)})}
async function saveVoice(){
 if(!curBlob){alert('Da farko yi rikodi!');return}
 let name=document.getElementById('name').value||'Ba suna';
 let txt=document.getElementById('txt').value||'';
 let b64=await blobToBase64(curBlob);
 voices.push({id:Date.now(),name:name,text:txt,b64:b64,dur:secs,date:new Date().toISOString()});
 localStorage.setItem('bv_voices',JSON.stringify(voices));
 clearRec(); document.getElementById('name').value=''; document.getElementById('txt').value='';
 render(); alert('✅ An ajiye murya!');
}
function renderVoices(){
 let c=document.getElementById('vlist'); c.innerHTML='';
 voices.slice().reverse().forEach(v=>{
  let d=document.createElement('div'); d.className='m-item';
  d.innerHTML=`<div style="flex:1"><b>${v.name}</b> <span class="badge">${v.dur}s</span><br><small>${v.text.substring(0,60)}</small><br><audio controls src="${v.b64}" style="width:100%;margin-top:4px"></audio></div><div><button onclick="delVoice(${v.id})" style="background:#e11;color:#fff;border:none;padding:10px 12px;border-radius:8px;font-weight:800">🗑️</button></div>`;
  c.appendChild(d);
 });
 document.getElementById('vlistC').innerText=voices.length;
}
function delVoice(id){ if(confirm('Goge wannan murya?')){voices=voices.filter(x=>x.id!=id);localStorage.setItem('bv_voices',JSON.stringify(voices));render();}}
document.getElementById('cam').addEventListener('change',handleFile);
document.getElementById('gal').addEventListener('change',handleFile);
function handleFile(e){
 let f=e.target.files[0]; if(!f)return;
 if(f.size>8*1024*1024){alert('Hoto ya yi yawa - kasa da 8MB');return}
 let r=new FileReader();
 r.onload=()=>{
  curPhotoData=r.result;
  let img=document.getElementById('preview'); img.src=curPhotoData; img.style.display='block';
  document.getElementById('pinfo').innerHTML='✅ Hoto ya shigo! '+(f.size/1024).toFixed(1)+'KB';
 };
 r.readAsDataURL(f);
}
function clearPhoto(){ curPhotoData=null; document.getElementById('preview').style.display='none'; document.getElementById('preview').src=''; document.getElementById('pinfo').innerHTML=''; document.getElementById('cam').value=''; document.getElementById('gal').value=''; }
function savePhoto(){
 if(!curPhotoData){alert('Da farko dauki hoto!');return}
 let type=document.getElementById('ptype').value;
 let desc=document.getElementById('pdesc').value;
 photos.push({id:Date.now(),type:type,desc:desc,b64:curPhotoData,date:new Date().toISOString()});
 localStorage.setItem('bv_photos',JSON.stringify(photos));
 clearPhoto(); document.getElementById('pdesc').value='';
 render(); alert('✅ An ajiye hoton!');
}
function renderPhotos(){
 let c=document.getElementById('plist'); c.innerHTML='';
 photos.slice().reverse().forEach(p=>{
  let d=document.createElement('div'); d.style.cssText='background:#fff;border:2px solid #16a34a;border-radius:10px;overflow:hidden';
  d.innerHTML=`<img src="${p.b64}" style="width:100%;height:130px;object-fit:cover"><div style="padding:6px"><small><b>${p.type}</b><br>${(p.desc||'').substring(0,40)}</small><br><button onclick="delPhoto(${p.id})" style="background:#e11;color:#fff;border:none;padding:6px 10px;border-radius:6px;width:100%;margin-top:4px">🗑️ Goge</button></div>`;
  c.appendChild(d);
 });
 document.getElementById('plistC').innerText=photos.length;
}
function delPhoto(id){ if(confirm('Goge wannan hoto?')){photos=photos.filter(x=>x.id!=id);localStorage.setItem('bv_photos',JSON.stringify(photos));render();}}
function render(){
 renderVoices(); renderPhotos();
 let vc=voices.length, pc=photos.length;
 document.getElementById('vc').innerText=vc; document.getElementById('pc').innerText=pc;
 document.getElementById('val').innerText=vc+pc;
 document.getElementById('sv').innerText=vc; document.getElementById('sp').innerText=pc;
 document.getElementById('stot').innerText=vc+pc;
}
function base64ToBlob(b64){
 let parts=b64.split(','); let mime=parts[0].match(/:(.*?);/)[1]; let bstr=atob(parts[1]); let n=bstr.length; let u8=new Uint8Array(n); for(let i=0;i<n;i++)u8[i]=bstr.charCodeAt(i); return new Blob([u8],{type:mime});
}
async function zipVoices(){
 if(!voices.length){alert('Babu murya');return}
 let zip=new JSZip(); let folder=zip.folder('murya');
 voices.forEach((v,i)=>{ folder.file(`murya_${i+1}_${v.name.replace(/\s+/g,'_')}.webm`,base64ToBlob(v.b64)); folder.file(`murya_${i+1}_info.txt`,`Suna: ${v.name}\nFada: ${v.text}\nTsawon: ${v.dur}s\nRana: ${v.date}`); });
 let content=await zip.generateAsync({type:'blob'}); downloadBlob(content,'BULANGU_MURYA_'+Date.now()+'.zip'); document.getElementById('status').innerText='✅ An sauke murya!';
}
async function zipPhotos(){
 if(!photos.length){alert('Babu hoto');return}
 let zip=new JSZip(); let folder=zip.folder('hotuna');
 photos.forEach((p,i)=>{ let ext=p.b64.includes('png')?'png':'jpg'; folder.file(`hoto_${i+1}_${p.type}.`+ext,base64ToBlob(p.b64)); folder.file(`hoto_${i+1}_bayani.txt`,`Nau'i: ${p.type}\nBayani: ${p.desc}\nRana: ${p.date}`); });
 let content=await zip.generateAsync({type:'blob'}); downloadBlob(content,'BULANGU_HOTUNA_'+Date.now()+'.zip'); document.getElementById('status').innerText='✅ An sauke hoto!';
}
async function zipAll(){
 if(!voices.length && !photos.length){alert('Babu komai');return}
 let zip=new JSZip();
 if(voices.length){ let f=zip.folder('murya'); voices.forEach((v,i)=>{ f.file(`murya_${i+1}.webm`,base64ToBlob(v.b64)); }); }
 if(photos.length){ let f=zip.folder('hotuna'); photos.forEach((p,i)=>{ f.file(`hoto_${i+1}.jpg`,base64ToBlob(p.b64)); }); }
 let content=await zip.generateAsync({type:'blob'}); downloadBlob(content,'BULANGU_DUKA_'+Date.now()+'.zip'); document.getElementById('status').innerText='✅ An sauke duka!';
}
function downloadBlob(blob,name){ let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1200); }
function clearAll(){ if(confirm('Goge DUKA murya da hoto?')){voices=[];photos=[];localStorage.removeItem('bv_voices');localStorage.removeItem('bv_photos');render();alert('An goge duka!')} }
render();
</script>
</body>
</html>
